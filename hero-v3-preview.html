<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COREON Hero v3 Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07192d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#fff}.hero{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(520px,.95fr);align-items:center;gap:42px;padding:70px clamp(28px,5vw,78px);background:radial-gradient(circle at 80% 22%,rgba(52,196,255,.22),transparent 27%),radial-gradient(circle at 18% 86%,rgba(23,185,163,.14),transparent 31%),linear-gradient(132deg,#05162b 0%,#082b50 54%,#0e568b 100%);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:54px 54px;pointer-events:none}.copy,.stage{position:relative;z-index:1}.badge{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(86,224,255,.28);background:rgba(7,42,67,.55);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:850;letter-spacing:.07em}.dot{width:9px;height:9px;border-radius:50%;background:#1ed8c5;box-shadow:0 0 14px #1ed8c5}.copy h1{font-size:clamp(56px,6.3vw,92px);line-height:.98;letter-spacing:-.065em;margin:28px 0 24px;max-width:760px}.copy h1 em{font-style:normal;color:#73dcff}.lead{font-size:clamp(19px,1.55vw,24px);line-height:1.72;color:#d8ebfa;max-width:800px}.lead strong{color:#fff}.cta{display:flex;gap:12px;margin-top:30px}.btn{padding:17px 25px;border-radius:999px;font-weight:900}.btn.primary{background:#18c8b0}.btn.ghost{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.05)}.proof{margin-top:28px;font-size:13px;color:#b9d9e8;display:flex;gap:22px;flex-wrap:wrap}.stage{min-height:650px;display:flex;align-items:center;justify-content:center}.stage svg{width:100%;max-width:900px;overflow:visible;filter:drop-shadow(0 28px 60px rgba(0,18,41,.28))}.ambient ellipse{fill:none;stroke:#27baff;stroke-width:1;opacity:.11;stroke-dasharray:4 10}.loop-shadow{fill:none;stroke:#031f57;stroke-width:100;stroke-linecap:round;stroke-linejoin:round;opacity:.96}.loop-main{fill:none;stroke:url(#loopGradient);stroke-width:82;stroke-linecap:round;stroke-linejoin:round;filter:url(#loopGlow)}.loop-inner{fill:none;stroke:url(#loopHighlight);stroke-width:5;stroke-linecap:round;opacity:.95;filter:url(#dotGlow)}.loop-spark{fill:none;stroke:#c9fbff;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 15;opacity:.58;animation:spark 7.5s linear infinite}.light-dot{filter:url(#dotGlow)}.star{fill:#dffbff;filter:url(#starGlow);animation:twinkle 4.8s ease-in-out infinite;transform-origin:center}.s2{animation-delay:-1.2s}.s3{animation-delay:-2.6s}.s4{animation-delay:-3.7s}.node-halo{fill:#092d50;stroke:#39cfff;stroke-width:1.2;opacity:.78;filter:url(#dotGlow)}.node-ring{fill:#071b32;stroke:#6be8ff;stroke-width:1.4}.node-icon{fill:none;stroke:#a6f4ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#fff;font-size:14px;font-weight:850}.node-sub{fill:#a9cddd;font-size:10px}.engine{text-anchor:middle;fill:#fff;font-size:31px;font-weight:850}.engine .sub{font-size:11px;letter-spacing:.12em;fill:#b6dce9}.node{animation:pulse 5.6s ease-in-out infinite}@keyframes spark{to{stroke-dashoffset:-240}}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.72)}50%{opacity:1;transform:scale(1.45)}}@keyframes pulse{0%,100%{opacity:.84}50%{opacity:1;filter:drop-shadow(0 0 10px rgba(67,221,255,.48))}}@media(max-width:1050px){.hero{grid-template-columns:1fr;padding-top:48px}.stage{min-height:520px}.copy h1{font-size:clamp(48px,10vw,76px)}}@media(max-width:650px){.hero{padding:36px 20px}.stage{min-height:430px}.proof{gap:10px}.copy h1{font-size:48px}.lead{font-size:17px}.stage svg{transform:scale(.92)}}@media(prefers-reduced-motion:reduce){.star,.node,.loop-spark{animation:none!important}.light-dot{display:none}}
</style>
</head>
<body>
<section class="hero">
<div class="copy">
  <div class="badge"><span class="dot"></span>COREON SAFETY INTELLIGENCE · LIVE EXECUTION</div>

  <div class="cta"><div class="btn primary">제품 살펴보기</div><div class="btn ghost">무료로 시작하기</div></div>
  <div class="proof"><span>● KOSHA 공개 안전정보</span><span>● Human Review</span><span>● Evidence & Residual Risk</span></div>
</div>

  <filter id="loopGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<circle class="star s3" cx="102" cy="516" r="1.8"/><circle class="star s4" cx="171" cy="580" r="2.2"/><circle class="star" cx="267" cy="535" r="1.4"/><circle class="star s2" cx="352" cy="592" r="1.9"/><circle class="star s3" cx="475" cy="546" r="1.6"/><circle class="star s4" cx="586" cy="581" r="2.1"/><circle class="star" cx="685" cy="538" r="1.4"/><circle class="star s2" cx="805" cy="576" r="2"/>
<circle class="star s3" cx="82" cy="270" r="1.2"/><circle class="star s4" cx="847" cy="258" r="1.4"/><circle class="star" cx="858" cy="434" r="1.2"/><circle class="star s2" cx="70" cy="420" r="1.5"/>
</g>
<g><use href="#safetyLoopPath" class="loop-shadow"/><use href="#safetyLoopPath" class="loop-main"/><use href="#safetyLoopPath" class="loop-inner"/><use href="#safetyLoopPath" class="loop-spark"/></g>
<g><circle r="7" fill="#fff" class="light-dot"><animateMotion dur="8.6s" repeatCount="indefinite"><mpath href="#safetyLoopPath"/></animateMotion></circle><circle r="4.5" fill="#4deaff" class="light-dot"><animateMotion dur="8.6s" begin="-2.85s" repeatCount="indefinite"><mpath href="#safetyLoopPath"/></animateMotion></circle><circle r="5.5" fill="#22d8bf" class="light-dot"><animateMotion dur="8.6s" begin="-5.7s" repeatCount="indefinite"><mpath href="#safetyLoopPath"/></animateMotion></circle></g>
<g class="engine"><text x="660" y="318">COREON</text><text x="660" y="355">Safety AX</text><text class="sub" x="660" y="382">EXECUTION ENGINE</text></g>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COREON Hero v4.4 Final Node Refinement Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07192d}iframe{display:block;width:100%;height:100%;border:0;background:#07192d}
</style>
</head>
<body>
<iframe id="preview" src="/hero-v4-3-preview.html" title="COREON Hero v4.4 final preview"></iframe>
<script>
(() => {
  const frame=document.getElementById('preview');
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc) return;
      doc.title='COREON Hero v4.4 Final Preview';
      const groups=[...doc.querySelectorAll('svg g.node')];
      const byLabel=(label)=>groups.find(g=>g.textContent.includes(label));
      const move=(label,x,y)=>{const g=byLabel(label);if(g)g.setAttribute('transform',`translate(${x} ${y})`)};

      // Final micro-spacing: keep the ribbon untouched and give labels more breathing room.
      move('HAZARD',126,116);
      move('KOSHA',462,76);
      move('HUMAN REVIEW',790,122);
      move('SAFE CLOSURE',86,353);
      move('ACTION',858,350);
      move('RESIDUAL RISK',414,610);
      move('EVIDENCE',742,600);

      // Keep node typography compact around the object.
      const action=byLabel('ACTION');
      if(action){
        const title=action.querySelector('.node-title');
        const sub=action.querySelector('.node-sub');
        if(title){title.setAttribute('x','-48');title.setAttribute('text-anchor','end')}
        if(sub){sub.setAttribute('x','-48');sub.setAttribute('text-anchor','end')}
      }
      const closure=byLabel('SAFE CLOSURE');
      if(closure){
        const title=closure.querySelector('.node-title');
        const sub=closure.querySelector('.node-sub');
        if(title){title.setAttribute('x','48');title.setAttribute('text-anchor','start')}
        if(sub){sub.setAttribute('x','48');sub.setAttribute('text-anchor','start')}
      }
      doc.documentElement.dataset.coreonHeroPreview='v4.4-final-node-refinement';
    }catch(e){console.error('v4.4 preview patch failed',e)}
  });
})();
</script>
</body>
</html>

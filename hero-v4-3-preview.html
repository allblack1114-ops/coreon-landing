<style>
*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#07192d;color:#fff}.header{height:82px;background:#fff;color:#0a2038;display:flex;align-items:center;padding:0 7vw;gap:34px;border-bottom:1px solid #dbe5ee}.brand{font-weight:900;font-size:24px}.brand small{display:block;font-size:11px;color:#6a7a89}.nav{display:flex;gap:27px;font-weight:800;font-size:14px}.actions{margin-left:auto;display:flex;gap:10px}.pill{padding:12px 17px;border:1px solid #dce6ef;border-radius:999px;font-weight:800;font-size:13px}.pill.dark{background:#071b31;color:#fff;border-color:#071b31}

.stage{min-height:650px;display:flex;align-items:center;justify-content:center}.stage svg{width:100%;max-width:940px;overflow:visible;filter:drop-shadow(0 30px 65px rgba(0,18,41,.34))}.star{fill:#e9fdff;filter:url(#starGlow);animation:twinkle 4.6s ease-in-out infinite}.s2{animation-delay:-1.3s}.s3{animation-delay:-2.4s}.s4{animation-delay:-3.5s}.node-halo{fill:#092d50;stroke:#3ed0ff;stroke-width:1.2;opacity:.78;filter:url(#nodeGlow)}.node-ring{fill:#071b32;stroke:#77eaff;stroke-width:1.4}.node-icon{fill:none;stroke:#a6f4ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#fff;font-size:14px;font-weight:850}.node-sub{fill:#a9cddd;font-size:10px}.node{animation:pulse 5.8s ease-in-out infinite}.engine{text-anchor:middle;fill:#fff;font-size:27px;font-weight:850}.engine .sub{font-size:9.5px;letter-spacing:.12em;fill:#b6dce9}.flowdot{filter:url(#nodeGlow)}

name: Apply Public Surface Focus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-public-surface-focus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deprioritize pilot and adjacent pages without deleting them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['vision-edge.html','use-cases/public/vision-edge.html','trust/vision-edge.html']:
              p=Path(rel); s=p.read_text(encoding='utf-8')
              marker='<meta name="robots" content="noindex,follow">'
              if marker not in s:
                  anchor='<meta name="viewport" content="width=device-width,initial-scale=1">'
                  if s.count(anchor)!=1: raise SystemExit(f'VIEWPORT_ANCHOR_NOT_UNIQUE:{rel}')
                  s=s.replace(anchor,anchor+marker,1)
                  p.write_text(s,encoding='utf-8')
          p=Path('sitemap.xml'); lines=p.read_text(encoding='utf-8').splitlines()
          remove=(
            '/vision-edge.html','/use-cases/public/vision-edge.html','/trust/vision-edge.html',
            '/defense-industrial-safety-solution.html','/industrial-safety-risk-management.html','/patent-based-safety-structure.html'
          )
          lines=[line for line in lines if not any(x in line for x in remove)]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Verify focused public surface
        run: node tests/public-surface-focus-v2812.test.js
      - name: Commit public surface focus
        run: |
          if git diff --quiet -- sitemap.xml vision-edge.html use-cases/public/vision-edge.html trust/vision-edge.html; then echo 'Public surface already focused.'; exit 0; fi
          git config user.name 'COREON Public Surface Assurance'
          git config user.email 'public-surface@coreon-global.com'
          git add sitemap.xml vision-edge.html use-cases/public/vision-edge.html trust/vision-edge.html
          git commit -m 'seo: focus public index on current Safety AX buying journey'
          git push origin HEAD:main

name: v28.6 Proof Procurement Center

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  proof-procurement-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KO/EN public authority pages
        shell: bash
        run: |
          set -euo pipefail
          for f in public-proof-procurement.html en/public-proof-procurement.html; do
            test -s "$f"
            grep -Fq 'name="viewport"' "$f"
            grep -Fq '@media(max-width:820px)' "$f"
            grep -Fq 'application/ld+json' "$f"
            grep -Fq 'SoftwareApplication' "$f"
            grep -Fq 'CSAP' "$f"
            grep -Fq '8-12 week' "$f" || grep -Fq '8~12주' "$f"
          done
          grep -Fq '실제 현장 표본이 없으면 성과수치를 만들지 않습니다' public-proof-procurement.html
          grep -Fq 'No field sample means no performance claim' en/public-proof-procurement.html
      - name: Validate release-axis
        run: |
          node -e "const x=require('./release-axis.json'); if(x.releaseAxis!=='v28.6-public-demand-engine') process.exit(1); if(!x.benchmarkLayers.includes('public-proof-procurement-center')) process.exit(1);"

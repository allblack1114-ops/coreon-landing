name: Canonical Proof Procurement Center

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  proof-procurement-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KO/EN public authority pages
        shell: bash
        run: |
          set -euo pipefail
          for f in public-proof-procurement.html en/public-proof-procurement.html; do
            test -s "$f"
            grep -Fq 'name="viewport"' "$f"
            grep -Fq '@media(max-width:' "$f"
            grep -Fq 'application/ld+json' "$f"
            grep -Fq 'SoftwareApplication' "$f"
            grep -Fq 'CSAP' "$f"
          done
          grep -Fq '8~12주' public-proof-procurement.html
          grep -Eq '8–12 week|8-12 week' en/public-proof-procurement.html
          grep -Fq '증거 없는 인증·성과·경쟁우위 주장은 공개하지 않습니다' public-proof-procurement.html
          grep -Fq 'Unsupported certification, outcome or superiority claims are not published' en/public-proof-procurement.html
          grep -Fq 'FAIL-CLOSED' public-proof-procurement.html
          grep -Fq 'FAIL-CLOSED' en/public-proof-procurement.html
      - name: Validate current release axis and evidence boundary
        run: |
          node - <<'NODE'
          const x=require('./release-axis.json');
          if(!/^v\d+\.\d+(?:\.\d+)?$/.test(x.releaseAxis||'')) process.exit(1);
          if(x.operationsRelease!==x.releaseAxis||x.packageVersion!=='28.33.0') process.exit(1);
          if(!x.benchmarkLayers.includes('public-proof-procurement-center')) process.exit(1);
          if(!x.principles.publicPerformanceClaimRequiresRealFieldEvidence) process.exit(1);
          if(!x.principles.csapClaimRequiresActualCertificate) process.exit(1);
          NODE

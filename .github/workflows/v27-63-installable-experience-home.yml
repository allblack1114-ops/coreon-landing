name: v28.12 Installable Product Home

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  product-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve Korean and English search equity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'COREON Safety AX Agent' index.html
          grep -Fq '발주처·공공기관' index.html
          grep -Fq '<link rel="canonical" href="https://www.coreon-global.com/"' index.html
          grep -Fq 'hreflang="en"' index.html
          grep -Fq 'COREON Safety AX Agent' en/index.html
          grep -Fq 'canonical" href="https://www.coreon-global.com/en/' en/index.html
      - name: Verify native desktop product and mobile fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'COREON-Safety-AX-28.12.0-win-x64.exe' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-mac-arm64.dmg' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-mac-x64.dmg' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=download-mobile' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-win-x64.exe' en/download.html
          grep -Fq 'app.coreon-global.com/install.html?source=download-mobile' en/download.html
      - name: Verify desktop source and build workflow exist
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop/package.json
          test -s desktop/main.cjs
          test -s desktop/preload.cjs
          test -s .github/workflows/coreon-desktop-build.yml
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('desktop/main.cjs','utf8');
          const must=[
            ['product origin','https://app.coreon-global.com'],
            ['customer portal entry','/customer-portal'],
            ['node isolation','nodeIntegration: false'],
            ['context isolation','contextIsolation: true'],
            ['sandbox','sandbox: true'],
            ['web security','webSecurity: true'],
            ['persistent session','persist:coreon-safety-ax']
          ];
          for(const [name,text] of must){if(!s.includes(text)){console.error('desktop contract missing:',name);process.exit(1)}}
          if(!s.includes('ENTRY_URL')||!s.includes('loadURL(ENTRY_URL)')){console.error('desktop contract missing: canonical entry wiring');process.exit(1)}
          console.log('PASS secure desktop customer-product entry contract');
          NODE
      - name: Preserve download-first homepage journey
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/download.html?source=coreon-home-download' index.html
          grep -Fq '/en/download.html?source=coreon-en-download' en/index.html
          grep -Fq 'enforceDownloadBoundary' assets/product-assistant.js
      - name: Reject stale PWA-only desktop claims
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '별도 Windows·macOS 전용 설치파일은 준비가 완료되면' download.html
          ! grep -Fq 'Dedicated Windows and macOS installers will be announced here only when they are ready' en/download.html

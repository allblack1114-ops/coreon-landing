name: COREON Desktop Installer Build

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/coreon-desktop-build.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/coreon-desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_WINDOWS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_WINDOWS_CSC_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify signature only when signed institutional release is enabled
        if: vars.COREON_DESKTOP_RELEASE_APPROVED == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\COREON-Safety-AX-*-win-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows installer signature invalid: $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: COREON-Safety-AX-Windows
          path: desktop/dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED == 'true' && secrets.COREON_APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build macOS installers
        run: |
          if [ "${{ vars.COREON_DESKTOP_RELEASE_APPROVED }}" = "true" ]; then
            npm run dist:mac:release
          else
            env -u CSC_LINK -u CSC_KEY_PASSWORD -u APPLE_ID -u APPLE_APP_SPECIFIC_PASSWORD -u APPLE_TEAM_ID CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
          fi
      - name: Verify signed macOS app only when signed institutional release is enabled
        if: vars.COREON_DESKTOP_RELEASE_APPROVED == 'true'
        run: |
          for app in dist/mac*/COREON\ Safety\ AX\ Agent.app; do
            [ -d "$app" ] || continue
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: COREON-Safety-AX-macOS
          path: desktop/dist/*
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum COREON-Safety-AX-* > SHA256SUMS.txt
      - name: Publish customer desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RELEASE: ${{ vars.COREON_DESKTOP_RELEASE_APPROVED }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="coreon-ax-v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ "$SIGNED_RELEASE" = "true" ]; then
            NOTES="COREON Safety AX Agent desktop installers. Windows and macOS builds are signed/notarized for institutional distribution. SHA-256 checksums are included."
          else
            NOTES="COREON Safety AX Agent customer installers for immediate product use. Windows and macOS may display operating-system publisher/security prompts until institutional code-signing/notarization is applied. Signed institutional packages can be supplied when required. SHA-256 checksums are included."
          fi
          gh release create "$TAG" release-assets/* \
            --title "COREON Safety AX Agent v${VERSION}" \
            --notes "$NOTES"

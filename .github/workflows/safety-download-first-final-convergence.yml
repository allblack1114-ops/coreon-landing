name: COREON Homepage Safety Download-First Convergence

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/safety-download-first-final-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align KO EN homepage and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          REL='v28.12'
          def patch(path, lang):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if 'class="menu-toggle"' not in s:
                  nav='<nav class="links">'
                  button=('''<button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">메뉴</button><nav class="links" id="site-nav">''' if lang=='ko' else '''<button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu</button><nav class="links" id="site-nav">''')
                  s=s.replace(nav,button,1)
              elif 'id="site-nav"' not in s:
                  s=s.replace('<nav class="links">','<nav class="links" id="site-nav">',1)
              css='''.menu-toggle{display:none;border:1px solid var(--l);background:#fff;color:var(--n);border-radius:999px;padding:9px 13px;font-weight:900}@media(max-width:900px){.menu-toggle{display:inline-flex}.links{position:absolute;left:12px;right:12px;top:68px;display:none!important;flex-direction:column;align-items:stretch;gap:5px;padding:12px;background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 16px 36px #071a3322}.links.open{display:flex!important}.links.open a{display:block!important;padding:10px 12px}.links.open .lang,.links.open .login{text-align:center}}'''
              if '.menu-toggle{display:none' not in s: s=s.replace('</style>',css+'</style>',1)
              script="""<script>(()=>{const b=document.querySelector('.menu-toggle'),n=document.getElementById('site-nav');if(!b||!n)return;const close=()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false')};b.addEventListener('click',()=>{const open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open))});n.addEventListener('click',e=>{if(e.target.closest('a'))close()});addEventListener('resize',()=>{if(innerWidth>900)close()})})();</script>"""
              if "classList.toggle('open')" not in s: s=s.replace('</body>',script+'</body>',1)
              if lang=='ko':
                  s=s.replace('https://app.coreon-global.com/install.html?source=coreon-home-nav','/download.html?source=coreon-home-nav')
                  old='''<div class="act"><a class="btn b" href="https://app.coreon-global.com/free-assessment?source=coreon-home-diagnosis">무료 안전진단</a><a class="btn a" href="https://app.coreon-global.com/signup.html?source=coreon-home-safety-room">무료 안전방 만들기</a><a class="btn c" href="https://app.coreon-global.com/inquiry.html?source=coreon-home-public">기업·공공기관 도입 상담</a></div>'''
                  new='''<div class="act"><a class="btn b" href="/download.html?source=coreon-home-free-start">무료로 시작하기</a><a class="btn a" href="/download.html?source=coreon-home-download">COREON AX Agent 다운로드</a><a class="btn c" href="https://app.coreon-global.com/inquiry.html?source=coreon-home-public">기업·공공기관 도입 상담</a></div>'''
                  s=s.replace(old,new)
                  s=s.replace('href="https://app.coreon-global.com/free-assessment?source=coreon-bottom-diagnosis">무료 안전진단</a>','href="/download.html?source=coreon-home-bottom-free">무료로 시작하기</a>')
                  s=s.replace('href="https://app.coreon-global.com/signup.html?source=coreon-bottom-room">무료 안전방 만들기</a>','href="/download.html?source=coreon-home-bottom-download">COREON AX Agent 다운로드</a>')
              else:
                  s=s.replace('https://app.coreon-global.com/install.html?source=coreon-en-nav','/en/download.html?source=coreon-en-nav')
                  old='''<div class="act"><a class="btn b" href="https://app.coreon-global.com/en/free-assessment?source=coreon-en-diagnosis">Free safety check</a><a class="btn a" href="https://app.coreon-global.com/signup.html?source=coreon-en-safety-room">Create free Safety Room</a><a class="btn c" href="https://app.coreon-global.com/en/free-assessment?source=coreon-en-public">Public / Enterprise inquiry</a></div>'''
                  new='''<div class="act"><a class="btn b" href="/en/download.html?source=coreon-en-free-start">Start free</a><a class="btn a" href="/en/download.html?source=coreon-en-download">Download COREON AX Agent</a><a class="btn c" href="https://app.coreon-global.com/inquiry.html?source=coreon-en-public&lang=en">Enterprise / Public-sector inquiry</a></div>'''
                  s=s.replace(old,new)
                  s=s.replace('href="https://app.coreon-global.com/en/free-assessment?source=coreon-en-bottom-diagnosis">Free safety check</a>','href="/en/download.html?source=coreon-en-bottom-free">Start free</a>')
                  s=s.replace('href="https://app.coreon-global.com/signup.html?source=coreon-en-bottom-room">Create free Safety Room</a>','href="/en/download.html?source=coreon-en-bottom-download">Download COREON AX Agent</a>')
              # canonical visible release badge
              if 'data-release-axis=' not in s:
                  badge=(f'<section data-release-axis="{REL}" style="padding:18px 0;background:#eef6fd;border-top:1px solid #dbe5ee"><div class="w"><strong>PROOF-GRADE SAFETY AX · {REL}</strong><span style="margin-left:8px;color:#63768a">KO/EN · PC/Mobile · Download-First</span></div></section>')
                  s=s.replace('</main>',badge+'</main>',1)
              p.write_text(s,encoding='utf-8')
          patch('index.html','ko'); patch('en/index.html','en')
          PY
      - name: Verify homepage parity
        run: node surface-parity-audit.js
      - name: Commit converged homepage
        run: |
          if git diff --quiet; then echo 'No homepage drift remains.'; exit 0; fi
          git config user.name 'COREON Release Bot'
          git config user.email 'release-bot@coreon-global.com'
          git add index.html en/index.html
          git commit -m 'Converge homepage download-first KO EN mobile parity'
          git push

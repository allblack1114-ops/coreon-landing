name: COREON v28.12 Homepage KO EN Mobile Parity Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/**'
      - 'surface-parity-audit.js'
      - 'test-homepage-v2741.js'
      - '.github/workflows/safety-download-first-final-convergence.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/**'
      - 'surface-parity-audit.js'
      - 'test-homepage-v2741.js'
      - '.github/workflows/safety-download-first-final-convergence.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current v28.12 KO EN mobile and download-first surfaces
        run: |
          set -euo pipefail
          grep -Fq 'name="viewport"' index.html
          grep -Fq 'name="viewport"' en/index.html
          grep -Fq '/download.html?source=home-free#install' index.html
          grep -Fq '/download.html?source=home-download#install' index.html
          grep -Fq '/en/download.html?source=en-home-free#install' en/index.html
          grep -Fq '/en/download.html?source=en-home-download#install' en/index.html
          if grep -Fq 'source=coreon-home-download' index.html; then echo 'legacy KO download source returned'; exit 1; fi
          if grep -Fq 'source=coreon-en-download' en/index.html; then echo 'legacy EN download source returned'; exit 1; fi
      - name: Run canonical parity regressions
        run: |
          node surface-parity-audit.js
          node test-homepage-v2741.js
          node tests/public-link-integrity-v2812.test.js

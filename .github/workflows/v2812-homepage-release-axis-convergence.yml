name: v28.12 Homepage KO EN Release Axis Convergence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge-homepage-release-axis:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align KO and EN homepage public release markers to v28.12
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path('index.html'),Path('en/index.html')]
          changed=[]
          marker_ko='<section data-release-axis="v28.12" style="padding:18px 0;background:#eef6fd;border-top:1px solid #dbe5ee"><div class="w"><strong>PROOF-GRADE SAFETY AX · v28.12</strong><span style="margin-left:8px;color:#63768a">Standard Field Pilot Evidence · KO/EN · PC/Mobile · GitHub/Production</span></div></section>'
          marker_en='<section data-release-axis="v28.12" style="padding:18px 0;background:#eef6fd;border-top:1px solid #dbe5ee"><div class="w"><strong>PROOF-GRADE SAFETY AX · v28.12</strong><span style="margin-left:8px;color:#63768a">Standard Field Pilot Evidence · KO/EN · PC/Mobile · GitHub/Production</span></div></section>'
          for p in files:
            text=p.read_text(encoding='utf-8')
            original=text
            text=text.replace('v28.5-proof-grade','v28.12-standard-field-pilot-evidence')
            text=text.replace('v28.5','v28.12')
            if 'data-release-axis="v28.12"' not in text:
              marker=marker_ko if str(p)=='index.html' else marker_en
              if '</main>' in text:
                text=text.replace('</main>',marker+'</main>',1)
              else:
                text=text.replace('</body>',marker+'</body>',1)
            if text!=original:
              p.write_text(text,encoding='utf-8')
              changed.append(str(p))
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Verify bilingual homepage parity
        run: |
          python - <<'PY'
          from pathlib import Path
          ko=Path('index.html').read_text(encoding='utf-8')
          en=Path('en/index.html').read_text(encoding='utf-8')
          for label,text in [('KO',ko),('EN',en)]:
            assert 'data-release-axis="v28.12"' in text, f'{label} homepage must expose v28.12 release marker'
            assert 'PROOF-GRADE SAFETY AX · v28.12' in text, f'{label} visible release label required'
            assert 'v28.5' not in text, f'{label} homepage must not expose stale v28.5 marker'
            assert 'viewport' in text, f'{label} homepage must remain mobile responsive'
          assert 'hreflang="en"' in ko
          assert 'hreflang="ko"' in en
          print('PASS v28.12 homepage KO/EN release-axis parity')
          PY
      - name: Commit convergence when required
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo 'Homepage already converged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html
          git commit -m 'v28.12 converge KO EN homepage release markers'
          git push origin HEAD:main

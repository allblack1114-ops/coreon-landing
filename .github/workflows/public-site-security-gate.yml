name: Public Site Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject sensitive tracked files
        shell: bash
        run: |
          set -euo pipefail
          blocked='(\.env($|\.)|\.p12$|\.pfx$|\.pem$|\.key$|\.keystore$|\.jks$|\.map$|\.exe$|\.msi$|\.msix$|\.dmg$|\.pkg$|\.apk$|\.aab$|\.ipa$)'
          bad="$(git ls-files | grep -Ei "$blocked" || true)"
          if [ -n "$bad" ]; then
            echo 'Blocked sensitive/build artifacts are tracked:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Reject private key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|BEGIN PKCS12' -- ':!*.md' ':!*.txt' ':!.github/**'; then
            echo 'Private key material detected in public homepage source.' >&2
            exit 1
          fi

      - name: Reject source map references
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -- 'sourceMappingURL=' -- '*.html' 'assets/**'; then
            echo 'Production source map reference detected.' >&2
            exit 1
          fi

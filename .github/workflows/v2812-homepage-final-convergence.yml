name: v28.12 Homepage Final Convergence

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/product-assistant.js'
      - 'assets/release-download-gate.js'
      - 'assets/v27-72-product-guide.js'
      - 'assets/v27-72-growth-banner.js'
      - 'assets/v27-73-governance.js'
      - 'assets/v27-80-industry-autodesk-ratio.js'
      - 'assets/v28-5-proof-grade-operational-intelligence.js'
      - 'tests/homepage-installed-boundary-v2812.test.js'
      - '.github/workflows/v2812-homepage-final-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize static homepage entry and cache authority
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'index.html':[
              ('product-assistant.js?v=27.74.7','product-assistant.js?v=28.12.1'),
              ('무료 진단으로 시작하고, 무료 안전방에서 직접 써보고, 필요하면 설치형 경험이나 기업·공공기관 도입으로 확장하세요.','홈페이지에서 제품과 무료 진단을 확인한 뒤, 동일한 COREON AX Agent를 설치하고 로그인해 무료 안전업무부터 시작하세요. 필요하면 기업·공공기관 도입으로 확장할 수 있습니다.')
            ],
            'en/index.html':[
              ('product-assistant.js?v=27.74.7','product-assistant.js?v=28.12.1'),
              ('Install / Download AX Agent →','Download COREON AX Agent →')
            ]
          }
          for name,pairs in replacements.items():
            p=Path(name)
            s=p.read_text(encoding='utf-8')
            for a,b in pairs:s=s.replace(a,b)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Verify homepage installed-product boundary
        run: node tests/homepage-installed-boundary-v2812.test.js
      - name: Commit convergence if required
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo 'Static homepage already converged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html
          git commit -m 'Converge static homepage to v28.12 installed product boundary'
          git push

name: COREON Public Product Entry Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/client-hardening.js'
      - 'test-homepage-v2741.js'
      - 'tests/public-link-integrity-v2812.test.js'
      - '.github/workflows/align-download-first-homepage.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/client-hardening.js'
      - 'test-homepage-v2741.js'
      - 'tests/public-link-integrity-v2812.test.js'
      - '.github/workflows/align-download-first-homepage.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify separated signup login and install authority
        run: |
          set -euo pipefail
          grep -Fq 'https://app.coreon-global.com/signup.html?source=coreon-home-free' assets/client-hardening.js
          grep -Fq 'https://app.coreon-global.com/signup.html?source=coreon-home-top-free' assets/client-hardening.js
          grep -Fq 'https://app.coreon-global.com/login.html?source=coreon-home-top-login' assets/client-hardening.js
          grep -Fq '/download.html?source=home-download#install' index.html
          grep -Fq '/download.html?source=home-install#install' index.html
          grep -Fq 'https://app.coreon-global.com/en/signup.html?source=coreon-en-home-free' assets/client-hardening.js
          grep -Fq '/en/download.html?source=en-home-download#install' en/index.html
          if grep -Fq 'COREON Safety AX Agent 설치' assets/client-hardening.js && grep -Fq 'signup.html?source=coreon-home-free' assets/client-hardening.js; then
            echo 'signup and install entries are deliberately separated'
          else
            echo 'public entry separation is incomplete'; exit 1
          fi
      - name: Verify canonical homepage and internal-link integrity
        run: |
          node test-homepage-v2741.js
          node tests/public-link-integrity-v2812.test.js

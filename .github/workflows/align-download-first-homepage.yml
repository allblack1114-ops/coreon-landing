name: COREON Public Product Entry Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/client-hardening.js'
      - 'test-homepage-v2741.js'
      - 'tests/public-link-integrity-v2812.test.js'
      - '.github/workflows/align-download-first-homepage.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/client-hardening.js'
      - 'test-homepage-v2741.js'
      - 'tests/public-link-integrity-v2812.test.js'
      - '.github/workflows/align-download-first-homepage.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify separated signup login and install authority
        run: |
          set -euo pipefail
          grep -Fq 'coreon-home-free&next=%2Fsafety-workspace.html' assets/client-hardening.js
          grep -Fq 'coreon-home-top-free&next=%2Fsafety-workspace.html' assets/client-hardening.js
          grep -Fq 'coreon-home-top-login&next=%2Fsafety-workspace.html' assets/client-hardening.js
          grep -Fq '/download.html?source=home-top-install#install' assets/client-hardening.js
          grep -Fq 'coreon-en-home-free&next=%2Fen%2Fsafety-workspace.html' assets/client-hardening.js
          grep -Fq 'coreon-en-home-top-free&next=%2Fen%2Fsafety-workspace.html' assets/client-hardening.js
          grep -Fq '/en/download.html?source=en-home-top-install#install' assets/client-hardening.js
          grep -Fq 'combined.replaceWith(free, install)' assets/client-hardening.js
          grep -Fq '/download.html?source=home-download#install' index.html
          grep -Fq '/en/download.html?source=en-home-download#install' en/index.html
          echo 'signup, login and install entries are deliberately separated'
      - name: Verify canonical homepage and internal-link integrity
        run: |
          node test-homepage-v2741.js
          node tests/public-link-integrity-v2812.test.js

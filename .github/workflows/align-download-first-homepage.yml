name: COREON v28.12 Download-First Homepage Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/product-assistant.js'
      - 'test-homepage-v2741.js'
      - '.github/workflows/align-download-first-homepage.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'assets/product-assistant.js'
      - 'test-homepage-v2741.js'
      - '.github/workflows/align-download-first-homepage.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current KO EN download-first CTA authority
        run: |
          set -euo pipefail
          grep -Fq '/download.html?source=home-free#install' index.html
          grep -Fq '/download.html?source=home-download#install' index.html
          grep -Fq '/download.html?source=home-install#install' index.html
          grep -Fq '/en/download.html?source=en-home-free#install' en/index.html
          grep -Fq '/en/download.html?source=en-home-download#install' en/index.html
          grep -Fq '/en/download.html?source=en-bottom-install#install' en/index.html
          if grep -Fq 'source=coreon-home-download' index.html; then echo 'legacy KO CTA source returned'; exit 1; fi
          if grep -Fq 'source=coreon-en-download' en/index.html; then echo 'legacy EN CTA source returned'; exit 1; fi
          if grep -Fq 'app.coreon-global.com/signup.html?source=coreon-home-safety-room' index.html; then echo 'legacy direct signup primary CTA returned'; exit 1; fi
      - name: Verify canonical homepage and internal-link integrity
        run: |
          node test-homepage-v2741.js
          node tests/public-link-integrity-v2812.test.js

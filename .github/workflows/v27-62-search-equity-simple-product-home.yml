name: v28.12 Search Equity + Product Boundary Regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'pricing.html'
      - 'en/pricing.html'
      - 'sitemap.xml'
      - '.github/workflows/v27-62-search-equity-simple-product-home.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'download.html'
      - 'en/download.html'
      - 'pricing.html'
      - 'en/pricing.html'
      - 'sitemap.xml'
      - '.github/workflows/v27-62-search-equity-simple-product-home.yml'

permissions:
  contents: read

jobs:
  preserve-search-equity-and-product-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve current Korean and English search identity
        run: |
          set -euo pipefail
          grep -Fq 'COREON Safety AX Agent' index.html
          grep -Fq '조치 전후 증빙' index.html
          grep -Fq '잔여위험 재확인' index.html
          grep -Fq 'hreflang="ko"' index.html
          grep -Fq 'hreflang="en"' index.html
          grep -Fq 'COREON Safety AX Agent' en/index.html
      - name: Enforce current four-plan commercial axis
        run: |
          set -euo pipefail
          grep -Fq 'Safety Start Free' pricing.html
          grep -Fq '월 149,000원' pricing.html
          grep -Fq '월 490,000원' pricing.html
          grep -Fq '연 18,000,000원' pricing.html
          grep -Fq 'KRW 149,000' en/pricing.html
          grep -Fq 'KRW 490,000' en/pricing.html
          grep -Fq 'KRW 18,000,000' en/pricing.html
          if grep -Fq '297,000원' pricing.html; then echo 'retired 297k Korean Safety Core price returned'; exit 1; fi
          if grep -Fq 'KRW 297,000' en/pricing.html; then echo 'retired 297k English Safety Core price returned'; exit 1; fi
          if grep -Fq '990,000원' pricing.html; then echo 'retired Safety Business base plan returned'; exit 1; fi
          grep -Fq '기본 SaaS 사용에는 별도 초기 구축비를 강제하지 않으며' pricing.html
          grep -Fq 'Base SaaS use does not require a mandatory setup fee' en/pricing.html
      - name: Verify distribution and sitemap boundary
        run: |
          set -euo pipefail
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-desktop' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-mobile' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-desktop-en' en/download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-mobile-en' en/download.html
          grep -Fq 'pricing.html' sitemap.xml
          grep -Fq 'download.html' sitemap.xml
      - name: Run canonical homepage boundary regression
        run: node test-homepage-v2741.js

name: Apply Homepage Plan Parity

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-home-plan-parity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch exact homepage plan sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patches={
          'index.html':(
          '''<section id="plans"><div class="w"><div class="head"><span class="k">이용 요금제</span><h2>사업장 규모와 안전관리 범위에 맞는 요금제를 선택하세요.</h2><p>현장 1곳의 기본 안전관리부터 복수 현장과 협력사를 관리하는 기업·공공기관 운영까지 필요한 범위에 맞춰 선택할 수 있습니다.</p></div><div class="g4 plans"><article class="card"><span class="num">FREE</span><h3>Safety Start Free</h3><ul><li>현장 1곳</li><li>위험제보·TBM·위험성평가</li><li>담당자·기한·조치·증빙·재확인</li></ul></article><article class="card featured"><span class="num">CORE</span><h3>Safety Core</h3><ul><li>현장 안전업무 운영</li><li>개선조치·증빙·재평가</li><li>안전관리자 중심 관리</li></ul></article><article class="card"><span class="num">OPERATIONS</span><h3>Safety Operations</h3><ul><li>복수 사용자 운영</li><li>미조치·기한초과 관리</li><li>승인·보고·추적 강화</li></ul></article><article class="card"><span class="num">ENTERPRISE / PUBLIC</span><h3>Enterprise / Public</h3><ul><li>다현장·협력사 통합관리</li><li>경영책임자·발주처 관점 점검</li><li>기업·공공기관 운영환경에 맞춘 확장</li></ul></article></div><div class="ctas"><a class="btn light" style="border:1px solid var(--l)" href="/pricing.html">요금제 확인</a></div></div></section>''',
          '''<section id="plans"><div class="w"><div class="head"><span class="k">이용 요금제</span><h2>무료에서도 핵심 안전업무를 끝까지 수행하고, 조직이 커지면 필요한 운영기능을 확장하세요.</h2><p>Safety Start Free는 실제 현장 안전업무의 핵심 폐루프를 제공합니다. 유료 플랜은 기능을 억지로 잠그는 대신 더 큰 조직의 증빙·보고·교육·설비·다현장·협력사·통합 운영을 확장합니다.</p></div><div class="g4 plans"><article class="card"><span class="num">FREE</span><h3>Safety Start Free</h3><ul><li>현장 1곳 · 사용자 3명 · 1GB</li><li>위험제보·TBM·위험성평가</li><li>담당자·기한·개선조치·기본 증빙</li><li>잔여위험 재확인 · 월 안전사건 수 제한 없음</li></ul></article><article class="card featured"><span class="num">CORE</span><h3>Safety Core</h3><ul><li>Safety Start Free 핵심 흐름</li><li>문서·증빙·조치이력 확대</li><li>공식 현장 안전관리 운영 강화</li></ul></article><article class="card"><span class="num">OPERATIONS</span><h3>Safety Operations</h3><ul><li>복수 사용자 운영</li><li>교육·설비·지원 AX</li><li>담당·승인·보고·추적 강화</li></ul></article><article class="card"><span class="num">ENTERPRISE / PUBLIC</span><h3>Enterprise / Public</h3><ul><li>다현장·협력사·도급 통합관리</li><li>권한·감사·경영 관제</li><li>API·SSO·기업·공공기관 맞춤 연계</li></ul></article></div><div class="ctas"><a class="btn light" style="border:1px solid var(--l)" href="/pricing.html">요금제 확인</a></div></div></section>'''),
          'en/index.html':(
          '''<section id="plans"><div class="w"><div class="head"><span class="k">Plans</span><h2>Choose the service level that fits your operation.</h2></div><div class="g4 plans"><article class="card"><span class="num">FREE</span><h3>Safety Start Free</h3><ul><li>1 site</li><li>Core safety workflow</li><li>Hazard reporting · TBM · risk assessment</li></ul></article><article class="card featured"><span class="num">CORE</span><h3>Safety Core</h3><ul><li>Formal site operation</li><li>Corrective action and evidence</li><li>Risk reassessment</li></ul></article><article class="card"><span class="num">OPERATIONS</span><h3>Safety Operations</h3><ul><li>Multiple users</li><li>Approval and reporting</li><li>Operational tracking</li></ul></article><article class="card"><span class="num">ENTERPRISE / PUBLIC</span><h3>Enterprise / Public</h3><ul><li>Multi-site management</li><li>Contractor oversight</li><li>Access, audit and integrations</li></ul></article></div><div class="ctas"><a class="btn light" style="border:1px solid var(--l)" href="/en/pricing.html">View pricing</a></div></div></section>''',
          '''<section id="plans"><div class="w"><div class="head"><span class="k">Plans</span><h2>Do real safety work for free. Upgrade when your operations need more scale and control.</h2><p>Safety Start Free supports the essential safety closed loop. Paid plans expand evidence, reporting, training, maintenance, multi-site governance, contractor oversight and integrations.</p></div><div class="g4 plans"><article class="card"><span class="num">FREE</span><h3>Safety Start Free</h3><ul><li>1 site · 3 users · 1GB</li><li>Hazard reporting · TBM · risk assessment</li><li>Owner · due date · corrective action · basic evidence</li><li>Residual-risk verification · no monthly safety-event cap</li></ul></article><article class="card featured"><span class="num">CORE</span><h3>Safety Core</h3><ul><li>Safety Start Free workflow</li><li>Expanded documents, evidence and action history</li><li>Structured site safety operations</li></ul></article><article class="card"><span class="num">OPERATIONS</span><h3>Safety Operations</h3><ul><li>Multi-user operations</li><li>Training · Maintenance · Support AX</li><li>Assignment · approval · reporting · tracking</li></ul></article><article class="card"><span class="num">ENTERPRISE / PUBLIC</span><h3>Enterprise / Public</h3><ul><li>Multi-site · contractor governance</li><li>Access · audit · management control</li><li>API · SSO · tailored enterprise/public integration</li></ul></article></div><div class="ctas"><a class="btn light" style="border:1px solid var(--l)" href="/en/pricing.html">View pricing</a></div></div></section>''')}

          changed=[]
          for path,(old,new) in patches.items():
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected exact plans section once, found {count}')
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
              changed.append(path)
          print('patched', ', '.join(changed))
          PY
      - name: Verify plan parity strings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '월 안전사건 수 제한 없음' index.html
          grep -Fq 'no monthly safety-event cap' en/index.html
          grep -Fq 'Safety Core' index.html
          grep -Fq 'Safety Operations' en/index.html
          grep -Fq '/pricing.html' index.html
          grep -Fq '/en/pricing.html' en/index.html
      - name: Commit validated homepage parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'COREON Landing Automation'
          git config user.email 'landing-automation@coreon-global.com'
          git add index.html en/index.html
          git commit -m 'plans: align home pages with adoption-led Free strategy'
          git push origin HEAD:main

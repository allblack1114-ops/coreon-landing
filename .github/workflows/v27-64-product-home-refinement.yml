name: v28.12 Product Home Refinement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  customer-product-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve canonical search identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'COREON Safety AX Agent' index.html
          grep -Fq '조치 전후 증빙' index.html
          grep -Fq '잔여위험 재평가' index.html
          grep -Fq 'hreflang="en"' index.html
          grep -Fq 'COREON Safety AX Agent' en/index.html
          grep -Fq 'canonical" href="https://www.coreon-global.com/' index.html
          grep -Fq 'canonical" href="https://www.coreon-global.com/en/' en/index.html
      - name: Enforce simple public journey and stable brand home
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'class="brand" href="/"' index.html
          grep -Fq 'class="brand" href="/en/"' en/index.html
          grep -Fq '/download.html?source=coreon-home-download' index.html
          grep -Fq '/en/download.html?source=coreon-en-download' en/index.html
          grep -Fq '기업·공공기관 도입 상담' index.html
          grep -Fq 'Enterprise / Public-sector inquiry' en/index.html
      - name: Enforce homepage-to-download boundary at runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'enforceDownloadBoundary' assets/product-assistant.js
          grep -Fq 'app.coreon-global.com/install.html' assets/product-assistant.js
          grep -Fq '/download.html?source=home-install-boundary' assets/product-assistant.js
          grep -Fq '/en/download.html?source=home-install-boundary' assets/product-assistant.js
      - name: Keep internal strategy language out of public primary copy
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'COREON Internal Master Control|대표 관리자|CEO 제품관제|CRM|Growth Operations' index.html en/index.html; then
            echo 'Internal administration language must not appear in public home.' >&2
            exit 1
          fi
      - name: Verify real native installers and mobile fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'COREON-Safety-AX-28.12.0-win-x64.exe' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-mac-arm64.dmg' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-mac-x64.dmg' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=download-mobile' download.html
          grep -Fq 'COREON-Safety-AX-28.12.0-win-x64.exe' en/download.html
          ! grep -Fq '별도 Windows·macOS 전용 설치파일은 준비가 완료되면' download.html
          ! grep -Fq 'Dedicated Windows and macOS installers will be announced here only when they are ready' en/download.html
      - name: Reject legacy pricing residue
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F '149,000원' index.html pricing.html download.html en/index.html en/pricing.html en/download.html
          ! grep -R -F '990,000원' index.html pricing.html download.html en/index.html en/pricing.html en/download.html

name: v28.12 Download Center Product Boundary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  download-product-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Korean download center SEO and distribution
        run: |
          set -euo pipefail
          grep -Fq 'rel="canonical" href="https://www.coreon-global.com/download.html"' download.html
          grep -Fq 'hreflang="en" href="https://www.coreon-global.com/en/download.html"' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-desktop' download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-mobile' download.html
      - name: Verify English download center SEO and distribution
        run: |
          set -euo pipefail
          grep -Fq 'rel="canonical" href="https://www.coreon-global.com/en/download.html"' en/download.html
          grep -Fq 'hreflang="ko" href="https://www.coreon-global.com/download.html"' en/download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-desktop-en' en/download.html
          grep -Fq 'app.coreon-global.com/install.html?source=coreon-home-free-mobile-en' en/download.html
      - name: Verify sitemap
        run: |
          grep -Fq 'https://www.coreon-global.com/download.html' sitemap.xml
          grep -Fq 'https://www.coreon-global.com/en/download.html' sitemap.xml
      - name: Reject obsolete PWA-only desktop claims
        run: |
          set -euo pipefail
          ! grep -Fq '별도 Windows·macOS 전용 설치파일은 준비가 완료되면' download.html
          ! grep -Fq 'Dedicated Windows and macOS installers will be announced here only when they are ready' en/download.html
          ! grep -Fq '내 기기에 설치하고' download.html
          ! grep -Fq 'Install it on your device' en/download.html

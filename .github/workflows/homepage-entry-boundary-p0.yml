name: COREON Homepage Product-Entry Boundary P0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/homepage-entry-boundary-p0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Keep homepage as product introduction and download entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name,lang in [('index.html','ko'),('en/index.html','en')]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              download='/download.html' if lang=='ko' else '/en/download.html'
              # Public homepage may explain product and industries, but must not execute Safety operations directly.
              s=re.sub(r'href="https://app\.coreon-global\.com/(?:en/)?free-assessment[^"]*"', f'href="{download}?source=homepage-operational-entry"', s)
              s=re.sub(r'href="https://app\.coreon-global\.com/(?:signup\.html|safety-room/start)[^"]*"', f'href="{download}?source=homepage-operational-entry"', s)
              if lang=='ko':
                  s=s.replace('3분 진단하기','무료로 시작하기')
                  s=re.sub(r'(<a[^>]+href=")[^"]+("[^>]*>도입 검토하기\s*→</a>)', r'\1#proof\2', s)
                  s=re.sub(r'(<a[^>]+href=")[^"]+("[^>]*>제품 흐름 보기\s*→</a>)', r'\1#how\2', s)
                  s=re.sub(r'(<a[^>]+href=")[^"]+("[^>]*>무료로 시작하기\s*→</a>)', r'\1/download.html?source=industry-free-start\2', s)
              else:
                  s=re.sub(r'3-minute[^<]*', 'Start free', s)
                  s=re.sub(r'(<a[^>]+href=")[^"]+("[^>]*>Start free\s*→</a>)', r'\1/en/download.html?source=industry-free-start\2', s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify homepage boundary
        run: |
          node surface-parity-audit.js
          python - <<'PY'
          from pathlib import Path
          blocked=('app.coreon-global.com/free-assessment','app.coreon-global.com/signup.html','app.coreon-global.com/safety-room/start')
          for name in ['index.html','en/index.html']:
              s=Path(name).read_text(encoding='utf-8')
              for token in blocked: assert token not in s, f'{name}: operational homepage link remains: {token}'
          ko=Path('index.html').read_text(encoding='utf-8')
          assert '3분 진단하기' not in ko
          assert '/download.html' in ko
          assert '도입 검토하기' in ko and '제품 흐름 보기' in ko
          print('HOMEPAGE PRODUCT-ENTRY BOUNDARY: PASS')
          PY
      - name: Commit homepage boundary repair
        run: |
          if git diff --quiet; then echo 'No homepage drift remains.'; exit 0; fi
          git config user.name 'COREON Release Bot'
          git config user.email 'release-bot@coreon-global.com'
          git add index.html en/index.html
          git commit -m 'Keep homepage as product introduction and download entry'
          git push

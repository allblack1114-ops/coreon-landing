name: COREON Homepage Product-Entry Boundary P0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/homepage-entry-boundary-p0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Keep homepage as product introduction and download entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name,lang in [('index.html','ko'),('en/index.html','en')]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if lang=='ko':
                  s=re.sub(r'href="[^"]+">3분 진단하기\s*→</a>', 'href="/download.html?source=industry-sme-start">무료로 시작하기 →</a>', s)
                  s=re.sub(r'href="[^"]+">도입 검토하기\s*→</a>', 'href="#proof">도입 검토하기 →</a>', s)
                  s=re.sub(r'href="[^"]+">제품 흐름 보기\s*→</a>', 'href="#how">제품 흐름 보기 →</a>', s)
                  s=re.sub(r'href="[^"]+">무료로 시작하기\s*→</a>', 'href="/download.html?source=industry-free-start">무료로 시작하기 →</a>', s)
              else:
                  s=re.sub(r'href="[^"]+">3-minute[^<]*→</a>', 'href="/en/download.html?source=industry-sme-start">Start free →</a>', s)
                  s=re.sub(r'href="[^"]+">Start free\s*→</a>', 'href="/en/download.html?source=industry-free-start">Start free →</a>', s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify homepage boundary
        run: |
          node surface-parity-audit.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '3분 진단하기' not in s
          assert s.count('/download.html?source=industry-') >= 1
          assert 'href="#proof">도입 검토하기 →</a>' in s
          assert 'href="#how">제품 흐름 보기 →</a>' in s
          assert 'app.coreon-global.com/free-assessment' not in s
          print('HOMEPAGE PRODUCT-ENTRY BOUNDARY: PASS')
          PY
      - name: Commit homepage boundary repair
        run: |
          if git diff --quiet; then echo 'No homepage drift remains.'; exit 0; fi
          git config user.name 'COREON Release Bot'
          git config user.email 'release-bot@coreon-global.com'
          git add index.html en/index.html
          git commit -m 'Keep homepage as product introduction and download entry'
          git push

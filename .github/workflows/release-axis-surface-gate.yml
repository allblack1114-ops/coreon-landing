name: COREON Release Axis Surface Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'release-axis.json'
      - 'public-proof-procurement.html'
      - 'en/public-proof-procurement.html'
      - 'assets/product-assistant.js'
      - 'assets/v28-5-proof-grade-operational-intelligence.js'
      - '.github/workflows/release-axis-surface-gate.yml'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'release-axis.json'
      - 'public-proof-procurement.html'
      - 'en/public-proof-procurement.html'
      - 'assets/product-assistant.js'
      - 'assets/v28-5-proof-grade-operational-intelligence.js'
      - '.github/workflows/release-axis-surface-gate.yml'

permissions:
  contents: read

concurrency:
  group: release-axis-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release axis manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('release-axis.json','utf8'));
          if(x.schema!=='coreon.release-axis.v1') throw Error('release axis schema mismatch');
          if(x.releaseAxis!=='v28.12') throw Error('release axis identity invalid: '+x.releaseAxis);
          const required=['app-ko-pc','app-ko-mobile','app-en-pc','app-en-mobile','landing-ko-pc','landing-ko-mobile','landing-en-pc','landing-en-mobile'];
          for(const s of required) if(!x.requiredSurfaces.includes(s)) throw Error('missing surface '+s);
          const layers=['performance-evidence','baseline-cohort-recurrence','public-saas-assurance','integration-evidence','vision-edge-field-proof','machine-readable-evidence-manifest','safety-evidence-dataset-governance','public-dpia-readiness','support-sla-console','pilot-evidence-report','management-intelligence','public-saas-certification-boundary','standard-8-12-week-pilot','public-proof-procurement-center'];
          for(const layer of layers) if(!x.benchmarkLayers.includes(layer)) throw Error('missing benchmark layer '+layer);
          if(!x.principles?.failClosedOnMismatch||!x.principles?.verifiedPassRequiresRealEvidence||!x.principles?.customerDataNotTrainingDataByDefault||!x.principles?.privacyAndSupportEvidenceRequired||!x.principles?.csapClaimRequiresActualCertificate||!x.principles?.publicPerformanceClaimRequiresRealFieldEvidence) throw Error('release mismatch/evidence policy incomplete');
          NODE
      - name: Verify Korean and English PC/mobile source parity
        run: |
          set -euo pipefail
          grep -Fq '<html lang="ko">' index.html
          grep -Fq 'name="viewport"' index.html
          grep -Fq '무료 안전진단' index.html
          grep -Fq '무료 안전방 만들기' index.html
          grep -Fq '기업·공공기관 도입 상담' index.html
          grep -Fq '<html lang="en">' en/index.html
          grep -Fq 'name="viewport"' en/index.html
          grep -Fq 'COREON Safety AX Agent' en/index.html
          grep -Fq '/download.html?source=coreon-home-download' index.html
          grep -Fq '/en/download.html?source=coreon-en-download' en/index.html
      - name: Preserve proof-grade evidence boundary
        run: |
          set -euo pipefail
          grep -Fq 'v28-5-proof-grade-operational-intelligence.js?v=28.5' assets/product-assistant.js
          grep -Fq 'customer data is not treated as AI training data by default' assets/v28-5-proof-grade-operational-intelligence.js
          grep -Fq '증거 없는 인증·성과·경쟁우위 주장은 공개하지 않습니다' public-proof-procurement.html
          grep -Fq 'Unsupported certification, outcome or superiority claims are not published' en/public-proof-procurement.html
      - name: Verify current Public Proof & Procurement Center
        run: |
          set -euo pipefail
          grep -Fq 'PUBLIC PROOF & PROCUREMENT CENTER' public-proof-procurement.html
          grep -Fq '8~12주' public-proof-procurement.html
          grep -Fq 'CSAP' public-proof-procurement.html
          grep -Fq 'PUBLIC PROOF & PROCUREMENT CENTER' en/public-proof-procurement.html
          grep -Eq '8–12 week|8-12 week' en/public-proof-procurement.html
          grep -Fq 'CSAP' en/public-proof-procurement.html
          grep -Fq '@media(max-width:' public-proof-procurement.html
          grep -Fq '@media(max-width:' en/public-proof-procurement.html

  live-pages-convergence:
    if: github.event_name == 'push'
    needs: source-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for GitHub Pages and verify KO/EN release axis
        run: |
          node - <<'NODE'
          const base='https://www.coreon-global.com';
          const expected='v28.12';
          const deadline=Date.now()+12*60*1000;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){const r=await fetch(base+path+'?releaseAxis='+Date.now(),{cache:'no-store'});return {r,t:await r.text()}}
          let last='';
          while(Date.now()<deadline){
            try{
              const m=await get('/release-axis.json');
              if(m.r.ok){
                const x=JSON.parse(m.t);
                if(x.releaseAxis===expected){
                  const ko=await get('/'); const en=await get('/en/'); const pko=await get('/public-proof-procurement.html'); const pen=await get('/en/public-proof-procurement.html');
                  if(ko.r.ok&&en.r.ok&&pko.r.ok&&pen.r.ok&&ko.t.includes('name="viewport"')&&en.t.includes('name="viewport"')&&pko.t.includes('PUBLIC PROOF & PROCUREMENT CENTER')&&pen.t.includes('PUBLIC PROOF & PROCUREMENT CENTER')){
                    console.log('PASS landing v28.12 KO/EN + Public Proof & Procurement convergence');
                    process.exit(0);
                  }
                }
              }
              last=m.t.slice(0,200);
            }catch(e){last=e.message}
            await sleep(15000);
          }
          throw Error('Landing did not converge to '+expected+': '+last);
          NODE

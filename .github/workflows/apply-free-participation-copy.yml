name: Apply Free Participation Copy Alignment

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-free-participation-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align Free participation wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'index.html':[
              ('현장 1곳 · 사용자 3명 · 1GB','현장 1곳 · 관리자·운영자 3명 · 현장 참여자 무제한 · 1GB'),
            ],
            'en/index.html':[
              ('1 site · 3 users · 1GB','1 site · 3 admin/operator seats · unlimited field participants · 1GB'),
            ],
            'pricing.html':[
              ('현장 1개 · 관리자/운영자 3명 · 저장공간 1GB','현장 1개 · 관리자/운영자 3명 · 현장 참여자 무제한 · 저장공간 1GB'),
              ('<li>월 신규 안전사건 수 제한 없음</li>','<li>현장 참여자 무제한 · 월 신규 안전사건 수 제한 없음</li>'),
            ],
            'en/pricing.html':[
              ('1 site · 3 users · 1GB storage','1 site · 3 admin/operator seats · unlimited field participants · 1GB storage'),
              ('<li>No monthly cap on new safety events</li>','<li>Unlimited field participants · no monthly cap on new safety events</li>'),
            ]
          }
          for path,repls in replacements.items():
              p=Path(path); text=p.read_text(encoding='utf-8')
              for old,new in repls:
                  count=text.count(old)
                  if count!=1: raise SystemExit(f'{path}: expected {old!r} once, found {count}')
                  text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Verify aligned wording
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '관리자·운영자 3명 · 현장 참여자 무제한' index.html
          grep -Fq '현장 참여자 무제한 · 월 신규 안전사건 수 제한 없음' pricing.html
          grep -Fq '3 admin/operator seats · unlimited field participants' en/index.html
          grep -Fq 'Unlimited field participants · no monthly cap on new safety events' en/pricing.html
      - name: Commit validated copy alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'COREON Landing Automation'
          git config user.email 'landing-automation@coreon-global.com'
          git add index.html en/index.html pricing.html en/pricing.html
          git commit -m 'plans: align Free field participation across landing'
          git push origin HEAD:main

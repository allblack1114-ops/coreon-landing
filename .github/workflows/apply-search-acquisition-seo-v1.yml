name: Apply Search Acquisition SEO v1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-search-acquisition-seo-v1.yml'

permissions:
  contents: write

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply guarded SEO metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, needle, addition, marker):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if marker in text:
                  print(path, 'already patched'); return
              if needle not in text:
                  raise SystemExit(f'{path}: expected head anchor not found')
              p.write_text(text.replace(needle, needle+addition, 1), encoding='utf-8')
              print(path, 'patched')

          ko_desc='<meta name="description" content="COREON Safety AX Agent는 유해·위험요인 확인부터 담당자 지정, 개선조치, 조치 전후 증빙, 잔여위험 재확인까지 중대재해 예방을 위한 현장 안전관리 업무를 연결합니다.">'
          ko_add='''\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<link rel="alternate" hreflang="x-default" href="https://www.coreon-global.com/">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="ko_KR">\n<meta property="og:site_name" content="COREON">\n<meta property="og:title" content="COREON Safety AX Agent | 중대재해 예방 현장 안전관리 솔루션">\n<meta property="og:description" content="위험제보·TBM·위험성평가에서 담당자·기한·개선조치·조치증빙·잔여위험 재확인까지 연결하는 중대재해 예방 안전관리 솔루션.">\n<meta property="og:url" content="https://www.coreon-global.com/">\n<meta property="og:image" content="https://www.coreon-global.com/assets/coreon-ax-hero-product.svg">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="COREON Safety AX Agent | 중대재해 예방 안전관리">\n<meta name="twitter:description" content="위험 발견부터 개선조치와 재확인까지 연결하는 현장 안전관리 솔루션.">\n<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.coreon-global.com/#organization","name":"주식회사 코레온홀딩스","alternateName":"COREON HOLDINGS Co., Ltd.","url":"https://www.coreon-global.com/","email":"contact@coreon-global.com"},{"@type":"SoftwareApplication","@id":"https://www.coreon-global.com/#software","name":"COREON Safety AX Agent","applicationCategory":"BusinessApplication","operatingSystem":"Windows, macOS, iOS, Android, Web","url":"https://www.coreon-global.com/","publisher":{"@id":"https://www.coreon-global.com/#organization"},"description":"위험제보, TBM, 위험성평가, 담당자와 기한, 개선조치, 조치 전후 증빙, 잔여위험 재확인을 연결하는 중대재해 예방 안전관리 솔루션."},{"@type":"WebSite","@id":"https://www.coreon-global.com/#website","url":"https://www.coreon-global.com/","name":"COREON","publisher":{"@id":"https://www.coreon-global.com/#organization"},"inLanguage":"ko-KR"}]}</script>'''
          insert_after('index.html',ko_desc,ko_add,'https://www.coreon-global.com/#software')

          en_desc='<meta name="description" content="COREON Safety AX Agent connects hazard reporting, TBM, risk assessment, owners, due dates, corrective action, before/after evidence and residual-risk reassessment for serious-accident prevention.">'
          en_add='''\n<link rel="alternate" hreflang="x-default" href="https://www.coreon-global.com/">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="en_US">\n<meta property="og:site_name" content="COREON">\n<meta property="og:title" content="COREON Safety AX Agent | Serious Accident Prevention Safety Management">\n<meta property="og:description" content="Connect hazard reporting, risk assessment, corrective action, evidence and residual-risk verification in one safety workflow.">\n<meta property="og:url" content="https://www.coreon-global.com/en/">\n<meta property="og:image" content="https://www.coreon-global.com/assets/coreon-ax-hero-product.svg">\n<meta name="twitter:card" content="summary_large_image">\n<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.coreon-global.com/#organization","name":"COREON HOLDINGS Co., Ltd.","url":"https://www.coreon-global.com/en/","email":"contact@coreon-global.com"},{"@type":"SoftwareApplication","@id":"https://www.coreon-global.com/#software","name":"COREON Safety AX Agent","applicationCategory":"BusinessApplication","operatingSystem":"Windows, macOS, iOS, Android, Web","url":"https://www.coreon-global.com/en/","publisher":{"@id":"https://www.coreon-global.com/#organization"},"description":"Safety management software connecting hazard reporting, TBM, risk assessment, corrective actions, evidence and residual-risk reassessment."}]}</script>'''
          insert_after('en/index.html',en_desc,en_add,'https://www.coreon-global.com/#software')
          PY

      - name: Commit SEO metadata only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html en/index.html; then
            echo 'No SEO metadata changes required.'
            exit 0
          fi
          git config user.name 'COREON SEO Automation'
          git config user.email 'seo-automation@coreon-global.com'
          git add index.html en/index.html
          git commit -m 'seo: strengthen homepage search metadata and structured data'
          git push origin HEAD:main

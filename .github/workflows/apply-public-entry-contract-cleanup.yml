name: Apply Public Entry Contract Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-public-entry-contract-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Replace legacy public product-entry CTAs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'en/trust.html',
              'en/use-cases/construction/index.html',
              'en/use-cases/consulting/index.html',
              'en/use-cases/index.html',
              'en/use-cases/manufacturing/index.html',
              'en/use-cases/public/index.html',
              'safety-ax-runtime.html',
              'trust/index.html',
              'use-cases/consulting/index.html',
          ]
          forbidden = ['/safety-room/', '/free-diagnosis', '/ax-agent-demo', '/customer-decision-hub', '/signup.html', '/enterprise-public?']

          def replace_anchor(text, fragment, english, source):
              login = fragment == '/ax-agent-demo'
              if english:
                  href = 'https://app.coreon-global.com/en/login?source=' + source if login else '/en/download.html?source=' + source + '#install'
                  label = 'Existing user sign in' if login else 'Install / Start free'
              else:
                  href = 'https://app.coreon-global.com/login.html?source=' + source + '&next=%2Fcustomer-portal' if login else '/download.html?source=' + source + '#install'
                  label = '기존 사용자 로그인' if login else '설치·무료 시작'

              pattern = re.compile(r'<a\b([^>]*?)href="[^"]*' + re.escape(fragment) + r'[^"]*"([^>]*)>.*?</a>', re.I)
              return pattern.sub(lambda m: '<a' + m.group(1) + 'href="' + href + '"' + m.group(2) + '>' + label + '</a>', text)

          changed = []
          for file in files:
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              before = text
              english = file.startswith('en/')
              source = ('en-' if english else '') + 'public-entry-contract'
              for fragment in forbidden:
                  text = replace_anchor(text, fragment, english, source)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed.append(file)

          if not changed:
              print('No legacy entry links required cleanup.')
          else:
              print('Updated:')
              for file in changed:
                  print('-', file)
          PY

      - name: Verify forbidden entry links are gone
        run: node .github/scripts/public-entry-contract-gate.js

      - name: Commit exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'COREON Product Contract Automation'
          git config user.email 'product-contract@coreon-global.com'
          git add en/trust.html en/use-cases/construction/index.html en/use-cases/consulting/index.html en/use-cases/index.html en/use-cases/manufacturing/index.html en/use-cases/public/index.html safety-ax-runtime.html trust/index.html use-cases/consulting/index.html
          git commit -m 'product: remove legacy direct-use entry links from public surfaces'
          git push origin HEAD:main

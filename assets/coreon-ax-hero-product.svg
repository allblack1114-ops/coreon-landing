<g class="t base">
<text x="78" y="219">◈  위험제보</text><text x="78" y="260">▧  TBM · 작업허가</text><text x="78" y="301">▣  개선조치</text><text x="78" y="342">▣  사진증빙</text><text x="78" y="383">◯  재확인</text><text x="78" y="424">♧  안전보건회의</text><text x="78" y="465">▤  보고서</text><text x="78" y="506">⚙  설정</text>
</g>

<!-- KPI -->

<rect x="582" y="139" width="148" height="132" rx="13" class="card"/><text x="600" y="169" class="t small">재확인 필요</text><text x="600" y="211" class="t x big">7</text><text x="600" y="241" class="m tiny">확인대기 <tspan fill="#1269d3" font-weight="700">4</tspan></text>
<rect x="743" y="139" width="148" height="132" rx="13" class="card"/><text x="761" y="169" class="t small">사진 이탈방</text><text x="761" y="211" class="x big" fill="#e43b39" font-family="Arial,'Noto Sans KR',sans-serif">9</text><text x="761" y="241" class="m tiny">통제필요 <tspan fill="#e43b39" font-weight="700">9</tspan></text>
</g>


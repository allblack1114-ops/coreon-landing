<text x="805" y="88" class="w b" font-size="15">현장 안전방</text>
<circle cx="755" cy="81" r="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M751 89h8" stroke="#fff" stroke-width="2"/>
<path d="M779 77a10 10 0 1 0 2 9" fill="none" stroke="#fff" stroke-width="2"/><path d="M778 71v8h8" fill="none" stroke="#fff" stroke-width="2"/>

<rect x="44" y="117" width="194" height="521" fill="#fff"/>
<line x1="238" y1="117" x2="238" y2="638" class="line"/>
<rect x="62" y="139" width="158" height="43" rx="9" fill="url(#blue)"/>

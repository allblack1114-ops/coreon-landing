<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">COREON AX Agent safety dashboard</title>
<desc id="desc">COREON AX Agent product visual showing safety dashboard, open risks, overdue actions, verification, evidence photos and risk type chart.</desc>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061a33"/><stop offset="1" stop-color="#0a2f58"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1778ef"/><stop offset="1" stop-color="#0c5bc7"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001020" flood-opacity=".35"/></filter>
  <style>
    .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#10233f}.w{font-family:Arial,'Noto Sans KR',sans-serif;fill:#fff}.m{font-family:Arial,'Noto Sans KR',sans-serif;fill:#63768a}.b{font-weight:700}.x{font-weight:800}.line{stroke:#dce5ee;stroke-width:1}.card{fill:#fff;stroke:#dce5ee;stroke-width:1.5}.tiny{font-size:13px}.small{font-size:15px}.base{font-size:17px}.mid{font-size:20px}.big{font-size:34px}
  </style>
</defs>
<rect x="30" y="28" width="900" height="624" rx="34" fill="url(#frame)" filter="url(#shadow)"/>
<rect x="44" y="44" width="872" height="594" rx="25" fill="#f7f9fc"/>
<path d="M44 69a25 25 0 0 1 25-25h822a25 25 0 0 1 25 25v48H44z" fill="#061a33"/>
